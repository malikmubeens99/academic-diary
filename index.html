<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Diary & Student Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
    
    /* Auth View */
    #authView { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .auth-tabs button { flex: 1; background: none; border: none; color: var(--text-muted); padding: 0.75rem; cursor: pointer; font-weight: 600; }
    .auth-tabs button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    input, textarea, select { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    button.primary { width: 100%; padding: 0.75rem; background: var(--primary); color: #0f172a; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: var(--primary-hover); }
    button.secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    button.small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    button.danger { background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
    
    /* App View Layout */
    #appView { display: flex; flex: 1; height: 100vh; overflow: hidden; }
    sidebar { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; }
    .brand { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 2rem; }
    .nav { background: none; border: none; color: var(--text-muted); text-align: left; padding: 0.75rem 1rem; border-radius: 6px; cursor: pointer; margin-bottom: 0.5rem; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
    .nav.active, .nav:hover { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); }
    .content-body { padding: 2rem; flex: 1; }
    
    /* Pages */
    .page { display: none; }
    .page.active { display: block; }
    
    /* Components */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); padding: 1.5rem; border-radius: 10px; }
    .stat { font-size: 2rem; font-weight: bold; color: var(--primary); margin-top: 0.5rem; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 1rem 0; }
    .class-card { background: var(--card-bg); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    .class-time { font-size: 0.85rem; color: var(--primary); font-weight: 600; }
    .badge { background: rgba(56,189,248,0.1); color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    
    /* Week grid */
    .week { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .day { background: var(--card-bg); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; }
    .day h4 { margin-bottom: 0.75rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .mini { background: rgba(0,0,0,0.2); padding: 0.6rem; border-radius: 6px; margin-bottom: 0.5rem; font-size: 0.85rem; }

    /* Modal */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--border); padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .upload { background: var(--card-bg); border: 2px dashed var(--border); padding: 1.5rem; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; }
    .upload input { margin: 1rem 0; }
    
    /* Settings toggles */
    .toggle { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .switch { width: 44px; height: 24px; background: rgba(255,255,255,0.2); border-radius: 12px; border: none; position: relative; cursor: pointer; transition: 0.3s; }
    .switch.on { background: var(--primary); }
    .switch i { width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: 0.3s; }
    .switch.on i { left: 23px; }
  </style>
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="authView">
    <div class="auth-card">
      <div class="brand">Academic Diary 📚</div>
      <div class="auth-tabs">
        <button class="active" data-auth="login">Login</button>
        <button data-auth="signup">Create account</button>
      </div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="primary">Login</button>
      </form>
      <form id="signupForm" class="hidden">
        <input type="text" id="signupName" placeholder="Full name" required>
        <input type="email" id="signupEmail" placeholder="Email address" required>
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required>
        <button type="submit" class="primary">Create account</button>
      </form>
      <div id="authMsg" class="muted" style="margin-top: 1rem; text-align: center; color: var(--danger);"></div>
    </div>
  </div>

  <!-- APP VIEW -->
  <div id="appView" class="hidden">
    <sidebar>
      <div class="brand">Academic Diary</div>
      <button class="nav active" data-page="home">🏠 Dashboard</button>
      <button class="nav" data-page="timetable">📅 Timetable</button>
      <button class="nav" data-page="diary">✎ Class Diary</button>
      <button class="nav" data-page="tasks">✓ Assignments</button>
      <button class="nav" data-page="settings">⚙ Settings</button>
      <div style="margin-top: auto;">
        <button class="secondary" id="quickAdd" style="width: 100%; margin-bottom: 0.5rem;">+ Quick Note</button>
        <button class="danger" id="logoutBtn" style="width: 100%;">Logout</button>
      </div>
    </sidebar>
    <main>
      <header>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <span class="muted" id="dateLabel"></span>
        </div>
      </header>
      <div class="content-body">
        <div id="home" class="page active"></div>
        <div id="timetable" class="page"></div>
        <div id="diary" class="page"></div>
        <div id="tasks" class="page"></div>
        <div id="settings" class="page"></div>
      </div>
    </main>
  </div>

  <!-- UNIVERSAL MODAL -->
  <div id="modal" class="hidden">
    <div class="modal-box">
      <div class="row" style="margin-bottom: 1.5rem;">
        <h3 id="modalTitle">Modal</h3>
        <button class="secondary small" id="closeModal">✕</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
