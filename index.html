<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Diary & Student Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="auth-container" class="container">
    <div class="card auth-box">
      <h2>Academic Diary 📚</h2>
      <p class="subtitle" style="color: #94a3b8; margin-bottom: 1rem;">Log in to manage your semester</p>
      <input type="email" id="email" placeholder="Email address">
      <input type="password" id="password" placeholder="Password">
      <div class="btn-group" style="display: flex; gap: 10px; margin-top: 1rem;">
        <button id="login-btn" class="btn primary" style="flex:1;">Login</button>
        <button id="signup-btn" class="btn secondary" style="flex:1;">Sign Up</button>
      </div>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <!-- APP VIEW -->
  <div id="app-container" class="app-layout hidden">
    <nav class="sidebar">
      <h2>Diary 📖</h2>
      <button class="nav-link active" data-target="dashboard">Dashboard</button>
      <button class="nav-link" data-target="timetable">Timetable</button>
      <button class="nav-link" data-target="diary">Class Diary</button>
      <button class="nav-link" data-target="tasks">Assignments</button>
      <button id="logout-btn" class="btn danger" style="margin-top:auto;">Logout</button>
    </nav>
    <main class="main-content">
      <header>
        <h1 id="view-title">Dashboard</h1>
        <span id="user-email-display" style="color: #94a3b8;"></span>
      </header>

      <!-- Dashboard View -->
      <section id="dashboard" class="view active-view">
        <div class="stats-grid">
          <div class="card"><h3>Classes Today</h3><p id="stat-classes" class="stat-num">0</p></div>
          <div class="card"><h3>Pending Tasks</h3><p id="stat-tasks" class="stat-num">0</p></div>
          <div class="card"><h3>Diary Entries</h3><p id="stat-diary" class="stat-num">0</p></div>
        </div>
        <div class="card">
          <h3>Today's Schedule</h3>
          <div id="today-classes-list" style="margin-top: 1rem;"></div>
        </div>
      </section>

      <!-- Timetable View -->
      <section id="timetable" class="view">
        <div class="card">
          <h3>Add Class</h3>
          <div style="display: grid; grid-template-columns: 1fr 2fr 1fr 1fr auto; gap: 10px; margin-top: 1rem;">
            <select id="class-day">
              <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
              <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
            </select>
            <input type="text" id="class-subject" placeholder="Subject Name" style="margin:0;">
            <input type="time" id="class-start" style="margin:0;">
            <input type="time" id="class-end" style="margin:0;">
            <button id="add-class-btn" class="btn primary">Add</button>
          </div>
        </div>
        <div class="card">
          <h3>Your Timetable</h3>
          <div id="timetable-list" style="margin-top: 1rem;"></div>
        </div>
      </section>

      <!-- Diary View -->
      <section id="diary" class="view">
        <div class="card">
          <h3>New Diary Entry</h3>
          <input type="text" id="diary-subject" placeholder="Subject / Topic">
          <textarea id="diary-notes" placeholder="What was taught today?" rows="4"></textarea>
          <button id="add-diary-btn" class="btn primary">Save Entry</button>
        </div>
        <div class="card">
          <h3>Past Entries</h3>
          <div id="diary-list" style="margin-top: 1rem;"></div>
        </div>
      </section>

      <!-- Tasks View -->
      <section id="tasks" class="view">
        <div class="card">
          <h3>Add Assignment</h3>
          <input type="text" id="task-title" placeholder="Assignment Title">
          <input type="text" id="task-subject" placeholder="Subject">
          <input type="date" id="task-due">
          <button id="add-task-btn" class="btn primary">Add Assignment</button>
        </div>
        <div class="card">
          <h3>Task List</h3>
          <div id="task-list" style="margin-top: 1rem;"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
